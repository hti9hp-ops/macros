<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم البوت والشكاوى - OS Shop</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181b24;
      --card-2: #202430;
      --border: #2c3142;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --primary: #5865f2;
      --primary-hover: #4752c4;
      --success: #23a55a;
      --danger: #da373c;
      --secondary: #4e5058;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 20px 14px 80px;
      line-height: 1.6;
    }
    .container { max-width: 1120px; margin: 0 auto; }
    .header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; background: var(--card); border: 1px solid var(--border);
      padding: 16px 20px; border-radius: 14px; margin-bottom: 18px;
    }
    .header h1 { margin: 0; font-size: 20px; }
    .status-bar { font-size: 13px; color: var(--muted); }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; margin-bottom: 18px;
    }
    .card h2 { margin: 0 0 14px; font-size: 17px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: #d1d5db; margin-bottom: 5px; font-weight: 600; }
    input[type="text"], textarea, select {
      width: 100%; background: var(--card-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; font-size: 14px;
    }
    textarea { min-height: 76px; resize: vertical; }
    .roles-box {
      display: flex; flex-wrap: wrap; gap: 8px; background: var(--card-2);
      border: 1px solid var(--border); border-radius: 9px; padding: 10px;
      max-height: 150px; overflow-y: auto;
    }
    .role-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #2b3040; padding: 5px 10px; border-radius: 7px; font-size: 12.5px; cursor: pointer;
    }
    .role-chip input { margin: 0; cursor: pointer; }
    .type-card {
      background: var(--card-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 15px; margin-bottom: 16px;
    }
    .type-header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .field-row {
      background: var(--card); border: 1px dashed var(--border);
      border-radius: 10px; padding: 12px; margin-bottom: 10px;
    }
    .btn {
      border: none; border-radius: 9px; padding: 9px 14px; font-size: 13.5px;
      font-weight: 600; cursor: pointer; color: #fff; transition: 0.15s;
    }
    .btn-primary { background: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .btn-secondary { background: #374151; }
    .btn-sm { padding: 6px 11px; font-size: 12.5px; }
    .actions-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .toast {
      position: fixed; bottom: 18px; left: 18px; right: 18px; max-width: 520px; margin: 0 auto;
      background: #1f2937; border: 1px solid var(--border); color: #fff;
      padding: 12px 16px; border-radius: 10px; font-size: 14px; display: none; z-index: 999;
    }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .preview-embed {
      background: #2b2d31;
      border-right: 4px solid var(--primary);
      border-radius: 8px;
      padding: 16px;
      max-width: 560px;
    }
    .preview-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .preview-desc { font-size: 13.5px; color: #dbdee1; white-space: pre-line; margin-bottom: 12px; }
    .preview-banner {
      width: 100%; max-height: 220px; object-fit: cover;
      border-radius: 8px; margin-bottom: 12px; display: none;
    }
    .preview-section { border-top: 1px solid #3f4147; padding-top: 10px; margin-top: 10px; }
    .preview-sec-title { font-weight: 700; font-size: 14px; }
    .preview-sec-desc { font-size: 12.5px; color: #b5bac1; margin: 3px 0 8px; }
    .preview-btn {
      display: inline-block; padding: 7px 14px; border-radius: 5px;
      font-size: 13px; font-weight: 600; color: #fff;
    }
    .p-Success { background: var(--success); }
    .p-Danger { background: var(--danger); }
    .p-Primary { background: var(--primary); }
    .p-Secondary { background: var(--secondary); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>لوحة تحكم الشكاوى والتذاكر</h1>
        <div class="status-bar" id="syncStatus">جاري تحميل البيانات...</div>
      </div>
      <div class="actions-row">
        <button class="btn btn-secondary btn-sm" onclick="loadData()">تحديث البيانات</button>
        <button class="btn btn-success" onclick="saveAllConfig()">حفظ كل الإعدادات</button>
      </div>
    </div>

    <div class="card">
      <h2>إعدادات رسالة فتح الشكوى وسجل الشكاوى</h2>
      <div class="grid-2">
        <div class="form-group">
          <label>روم إرسال لوحة أنواع الشكاوى</label>
          <select id="panelChannelId" onchange="syncFormToState()"></select>
        </div>
        <div class="form-group">
          <label>روم تسجيل الشكاوى (السجل والأرشيف)</label>
          <select id="logChannelId" onchange="syncFormToState()"></select>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>عنوان اللوحة</label>
          <input type="text" id="panelTitle" oninput="syncFormToState()" placeholder="اكتب عنوان اللوحة..." />
        </div>
        <div class="form-group">
          <label>رابط صورة البانر (اختياري)</label>
          <input type="text" id="panelImageUrl" oninput="syncFormToState()" placeholder="https://..." />
        </div>
      </div>
      <div class="form-group">
        <label>شرح عام يظهر في اللوحة</label>
        <textarea id="panelDescription" oninput="syncFormToState()" placeholder="اكتب الشرح العام الذي تريده..."></textarea>
      </div>
    </div>

    <div class="card">
      <h2>معاينة شكل اللوحة في الديسكورد</h2>
      <div class="preview-embed" id="panelPreview"></div>
    </div>

    <div class="card">
      <div class="type-header">
        <h2 style="border:none; margin:0; padding:0;">أنواع الشكاوى والحقول والصلاحيات</h2>
        <button class="btn btn-primary btn-sm" onclick="addTicketType()">+ إضافة نوع شكوى جديد</button>
      </div>
      <div class="hint" style="margin-bottom:14px;">
        الحد الأقصى للحقول في النافذة المنبثقة بديسكورد هو 5 حقول لكل نوع. يمكنك تعديل أو حذف أو إضافة أي نوع وحقل.
      </div>
      <div id="ticketTypesContainer"></div>
    </div>

    <div class="card">
      <h2>رسائل الترحيب والتوديع</h2>
      <div class="grid-2">
        <div class="form-group">
          <label><input type="checkbox" id="welcomeEnabled" onchange="syncFormToState()" /> تفعيل رسالة الترحيب</label>
          <select id="welcomeChannelId" onchange="syncFormToState()" style="margin-top:6px;"></select>
          <textarea id="welcomeMessage" oninput="syncFormToState()" style="margin-top:8px;"></textarea>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="goodbyeEnabled" onchange="syncFormToState()" /> تفعيل رسالة التوديع</label>
          <select id="goodbyeChannelId" onchange="syncFormToState()" style="margin-top:6px;"></select>
          <textarea id="goodbyeMessage" oninput="syncFormToState()" style="margin-top:8px;"></textarea>
        </div>
      </div>
    </div>

    <div class="actions-row" style="justify-content:flex-end;">
      <button class="btn btn-success" onclick="saveAllConfig()">حفظ كل الإعدادات</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxJKcSFAoJNPY0SWMG-JFWQs5z4wYjJIBnxaCj8q6zpTkw-qgWJOce5oDVknvBntu2xNA/exec';

    let state = {
      config: {
        panelChannelId: '',
        panelImageUrl: '',
        panelTitle: '',
        panelDescription: '',
        logChannelId: '',
        ticketTypes: [],
        welcomeEnabled: true,
        welcomeChannelId: '',
        welcomeMessage: '',
        goodbyeEnabled: true,
        goodbyeChannelId: '',
        goodbyeMessage: ''
      },
      meta: { categories: [], channels: [], roles: [], updatedAt: '' }
    };

    function showToast(msg, isError = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.borderColor = isError ? 'var(--danger)' : 'var(--success)';
      el.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3500);
    }

    function fillSelect(selectId, items, selectedValue, emptyLabel = '-- اختر --') {
      const sel = document.getElementById(selectId);
      sel.innerHTML = `<option value="">${emptyLabel}</option>`;
      (items || []).forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.name;
        if (item.id === selectedValue) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function renderRoleChips(container, roles, selectedIds, onToggle) {
      container.innerHTML = '';
      if (!roles || !roles.length) {
        container.innerHTML = '<span class="hint">لا توجد رولات مزامنة بعد</span>';
        return;
      }
      roles.forEach(role => {
        const label = document.createElement('label');
        label.className = 'role-chip';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = Array.isArray(selectedIds) && selectedIds.includes(role.id);
        cb.addEventListener('change', () => onToggle(role.id, cb.checked));
        label.appendChild(cb);
        label.appendChild(document.createTextNode(role.name));
        container.appendChild(label);
      });
    }

    function renderPreview() {
      const c = state.config;
      const box = document.getElementById('panelPreview');
      const imgHtml = (c.panelImageUrl && /^https?:\/\//i.test(c.panelImageUrl.trim()))
        ? `<img class="preview-banner" style="display:block;" src="${c.panelImageUrl.trim()}" alt="banner" onerror="this.style.display='none'" />`
        : '';

      const sectionsHtml = (c.ticketTypes || []).map(t => `
        <div class="preview-section">
          <div class="preview-sec-title">${t.sectionTitle || 'عنوان النوع'}</div>
          <div class="preview-sec-desc">${t.sectionDescription || ''}</div>
          <span class="preview-btn p-${t.buttonStyle || 'Primary'}">${t.buttonLabel || 'فتح شكوى'}</span>
        </div>
      `).join('');

      box.innerHTML = `
        ${imgHtml}
        <div class="preview-title">${c.panelTitle || 'عنوان اللوحة'}</div>
        <div class="preview-desc">${c.panelDescription || ''}</div>
        ${sectionsHtml || '<div class="hint">أضف نوع شكوى لمعاينة الأزرار.</div>'}
      `;
    }

    function syncFormToState() {
      state.config.panelChannelId = document.getElementById('panelChannelId').value;
      state.config.logChannelId = document.getElementById('logChannelId').value;
      state.config.panelTitle = document.getElementById('panelTitle').value;
      state.config.panelImageUrl = document.getElementById('panelImageUrl').value;
      state.config.panelDescription = document.getElementById('panelDescription').value;

      state.config.welcomeEnabled = document.getElementById('welcomeEnabled').checked;
      state.config.welcomeChannelId = document.getElementById('welcomeChannelId').value;
      state.config.welcomeMessage = document.getElementById('welcomeMessage').value;

      state.config.goodbyeEnabled = document.getElementById('goodbyeEnabled').checked;
      state.config.goodbyeChannelId = document.getElementById('goodbyeChannelId').value;
      state.config.goodbyeMessage = document.getElementById('goodbyeMessage').value;

      renderPreview();
    }

    function addTicketType() {
      if (!Array.isArray(state.config.ticketTypes)) state.config.ticketTypes = [];
      state.config.ticketTypes.push({
        id: 'type_' + Date.now(),
        sectionTitle: '',
        sectionDescription: '',
        buttonLabel: '',
        buttonStyle: 'Primary',
        categoryId: '',
        allowedRoleIds: [],
        staffRoleIds: [],
        evidenceNote: '',
        fields: []
      });
      renderTicketTypes();
      renderPreview();
    }

    function removeTicketType(idx) {
      state.config.ticketTypes.splice(idx, 1);
      renderTicketTypes();
      renderPreview();
    }

    function addField(typeIdx) {
      const t = state.config.ticketTypes[typeIdx];
      if (!t.fields) t.fields = [];
      if (t.fields.length >= 5) {
        showToast('الحد الأقصى هو 5 حقول لكل نوع شكوى في ديسكورد', true);
        return;
      }
      t.fields.push({ label: '', placeholder: '', style: 'Short', required: true });
      renderTicketTypes();
    }

    function removeField(typeIdx, fieldIdx) {
      state.config.ticketTypes[typeIdx].fields.splice(fieldIdx, 1);
      renderTicketTypes();
    }

    function renderTicketTypes() {
      const container = document.getElementById('ticketTypesContainer');
      container.innerHTML = '';
      const list = state.config.ticketTypes || [];

      list.forEach((t, tIdx) => {
        const card = document.createElement('div');
        card.className = 'type-card';

        card.innerHTML = `
          <div class="type-header">
            <strong>نوع الشكوى #${tIdx + 1}${t.sectionTitle ? ': ' + t.sectionTitle : ''}</strong>
            <button class="btn btn-danger btn-sm" onclick="removeTicketType(${tIdx})">حذف النوع</button>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label>عنوان القسم / نوع الشكوى</label>
              <input type="text" value="${t.sectionTitle || ''}" oninput="state.config.ticketTypes[${tIdx}].sectionTitle = this.value; renderPreview();" />
            </div>
            <div class="form-group">
              <label>الكاتكوري الذي يُفتح فيه روم الشكوى</label>
              <select id="cat_select_${tIdx}" onchange="state.config.ticketTypes[${tIdx}].categoryId = this.value"></select>
            </div>
          </div>
          <div class="form-group">
            <label>شرح نوع الشكوى</label>
            <input type="text" value="${t.sectionDescription || ''}" oninput="state.config.ticketTypes[${tIdx}].sectionDescription = this.value; renderPreview();" />
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label>نص الزر</label>
              <input type="text" value="${t.buttonLabel || ''}" oninput="state.config.ticketTypes[${tIdx}].buttonLabel = this.value; renderPreview();" />
            </div>
            <div class="form-group">
              <label>لون الزر</label>
              <select onchange="state.config.ticketTypes[${tIdx}].buttonStyle = this.value; renderPreview();">
                <option value="Success" ${t.buttonStyle === 'Success' ? 'selected' : ''}>أخضر (Success)</option>
                <option value="Danger" ${t.buttonStyle === 'Danger' ? 'selected' : ''}>أحمر (Danger)</option>
                <option value="Primary" ${t.buttonStyle === 'Primary' ? 'selected' : ''}>أزرق (Primary)</option>
                <option value="Secondary" ${t.buttonStyle === 'Secondary' ? 'selected' : ''}>رمادي (Secondary)</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>الرولات المسموح لها رؤية وتقديم هذا النوع (إذا تركته فارغ يظهر للجميع)</label>
            <div class="roles-box" id="allowed_roles_${tIdx}"></div>
          </div>
          <div class="form-group">
            <label>الرولات الإدارية التي تظهر عندها الشكوى وتستطيع استلامها وإغلاقها</label>
            <div class="roles-box" id="staff_roles_${tIdx}"></div>
          </div>
          <div class="form-group">
            <label>ملاحظة إضافية داخل إيمبد الشكوى المفتوحة (اختياري)</label>
            <textarea oninput="state.config.ticketTypes[${tIdx}].evidenceNote = this.value">${t.evidenceNote || ''}</textarea>
          </div>
          <div class="form-group">
            <div class="type-header">
              <label style="margin:0;">الحقول والأسئلة التي تظهر للمستخدم عند الضغط على الزر</label>
              <button class="btn btn-primary btn-sm" onclick="addField(${tIdx})">+ إضافة حقل</button>
            </div>
            <div id="fields_container_${tIdx}"></div>
          </div>
        `;

        container.appendChild(card);

        const catSel = document.getElementById(`cat_select_${tIdx}`);
        catSel.innerHTML = '<option value="">-- اختر كاتكوري --</option>';
        (state.meta.categories || []).forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.name;
          if (c.id === t.categoryId) opt.selected = true;
          catSel.appendChild(opt);
        });

        renderRoleChips(
          document.getElementById(`allowed_roles_${tIdx}`),
          state.meta.roles,
          t.allowedRoleIds || [],
          (roleId, checked) => {
            t.allowedRoleIds = t.allowedRoleIds || [];
            if (checked && !t.allowedRoleIds.includes(roleId)) t.allowedRoleIds.push(roleId);
            if (!checked) t.allowedRoleIds = t.allowedRoleIds.filter(id => id !== roleId);
          }
        );

        renderRoleChips(
          document.getElementById(`staff_roles_${tIdx}`),
          state.meta.roles,
          t.staffRoleIds || [],
          (roleId, checked) => {
            t.staffRoleIds = t.staffRoleIds || [];
            if (checked && !t.staffRoleIds.includes(roleId)) t.staffRoleIds.push(roleId);
            if (!checked) t.staffRoleIds = t.staffRoleIds.filter(id => id !== roleId);
          }
        );

        const fieldsBox = document.getElementById(`fields_container_${tIdx}`);
        (t.fields || []).forEach((f, fIdx) => {
          const fDiv = document.createElement('div');
          fDiv.className = 'field-row';
          fDiv.innerHTML = `
            <div class="type-header" style="margin-bottom:8px;">
              <span>حقل #${fIdx + 1}</span>
              <button class="btn btn-danger btn-sm" onclick="removeField(${tIdx}, ${fIdx})">حذف الحقل</button>
            </div>
            <div class="grid-2">
              <div class="form-group">
                <label>النص الذي يُكتب فوق الحقل (العنوان/السؤال)</label>
                <input type="text" value="${f.label || ''}" oninput="state.config.ticketTypes[${tIdx}].fields[${fIdx}].label = this.value" />
              </div>
              <div class="form-group">
                <label>النص التوضيحي داخل الحقل (Placeholder)</label>
                <input type="text" value="${f.placeholder || ''}" oninput="state.config.ticketTypes[${tIdx}].fields[${fIdx}].placeholder = this.value" />
              </div>
            </div>
            <div class="grid-2">
              <div class="form-group">
                <label>نوع الإدخال</label>
                <select onchange="state.config.ticketTypes[${tIdx}].fields[${fIdx}].style = this.value">
                  <option value="Short" ${f.style !== 'Paragraph' ? 'selected' : ''}>سطر قصير (Short)</option>
                  <option value="Paragraph" ${f.style === 'Paragraph' ? 'selected' : ''}>نص طويل / فقرة (Paragraph)</option>
                </select>
              </div>
              <div class="form-group" style="display:flex; align-items:flex-end;">
                <label><input type="checkbox" ${f.required !== false ? 'checked' : ''} onchange="state.config.ticketTypes[${tIdx}].fields[${fIdx}].required = this.checked" /> حقل إجباري</label>
              </div>
            </div>
          `;
          fieldsBox.appendChild(fDiv);
        });
      });
    }

    function applyConfigToForm() {
      const c = state.config;
      fillSelect('panelChannelId', state.meta.channels, c.panelChannelId, '-- اختر روم اللوحة --');
      fillSelect('logChannelId', state.meta.channels, c.logChannelId, '-- اختر روم السجل --');
      fillSelect('welcomeChannelId', state.meta.channels, c.welcomeChannelId, '-- اختر روم الترحيب --');
      fillSelect('goodbyeChannelId', state.meta.channels, c.goodbyeChannelId, '-- اختر روم التوديع --');

      document.getElementById('panelTitle').value = c.panelTitle || '';
      document.getElementById('panelImageUrl').value = c.panelImageUrl || '';
      document.getElementById('panelDescription').value = c.panelDescription || '';

      document.getElementById('welcomeEnabled').checked = c.welcomeEnabled !== false;
      document.getElementById('welcomeMessage').value = c.welcomeMessage || '';
      document.getElementById('goodbyeEnabled').checked = c.goodbyeEnabled !== false;
      document.getElementById('goodbyeMessage').value = c.goodbyeMessage || '';

      renderTicketTypes();
      renderPreview();
    }

    async function loadData() {
      document.getElementById('syncStatus').textContent = 'جاري جلب البيانات...';
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if (data.ok) {
          state.config = Object.assign({}, state.config, data.config || {});
          state.meta = Object.assign({}, state.meta, data.meta || {});
          applyConfigToForm();
          const upd = state.meta.updatedAt ? new Date(state.meta.updatedAt).toLocaleString('ar-IQ') : 'غير متزامن بعد';
          document.getElementById('syncStatus').textContent =
            `الرولات: ${state.meta.roles.length} | الرومات: ${state.meta.channels.length} | الكاتكوريات: ${state.meta.categories.length} | آخر مزامنة: ${upd}`;
        } else {
          showToast('فشل جلب البيانات', true);
        }
      } catch (e) {
        showToast('خطأ في الاتصال بالخادم', true);
      }
    }

    async function saveAllConfig() {
      syncFormToState();
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'save_config', config: state.config })
        });
        showToast('تم حفظ الإعدادات بنجاح!');
      } catch (e) {
        showToast('حدث خطأ أثناء الحفظ', true);
      }
    }

    loadData();
  </script>
</body>
</html>
