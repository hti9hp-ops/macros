<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم البوت</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; background: #111318; color: #f3f4f6; margin: 0; padding: 20px; }
    .box { max-width: 740px; margin: auto; background: #1b1f27; padding: 20px; border-radius: 12px; }
    h2, h3 { margin-top: 0; color: #818cf8; }
    label { display: block; margin: 12px 0 6px; font-size: 14px; color: #d1d5db; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #374151; background: #111318; color: #fff; }
    textarea { min-height: 75px; }
    .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .row input[type="checkbox"] { width: auto; }
    .roles-box { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; background: #111318; padding: 12px; border-radius: 8px; border: 1px solid #374151; max-height: 200px; overflow-y: auto; }
    .role-item { display: flex; align-items: center; gap: 6px; font-size: 13px; background: #1b1f27; padding: 6px 8px; border-radius: 6px; }
    .role-item input { width: auto; margin: 0; }
    button { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #6366f1; color: #fff; font-size: 16px; cursor: pointer; }
    button:hover { background: #4f46e5; }
    .hint { font-size: 12px; color: #9ca3af; }
    .msg { margin-top: 12px; font-weight: bold; }
    hr { border: 0; border-top: 1px solid #2d3340; margin: 22px 0; }
  </style>
</head>
<body>
  <div class="box">
    <h2>⚙️ تحكم التكت والترحيب والتوديع</h2>

    <label>رابط Google Apps Script (Web App URL)</label>
    <input id="apiUrl" type="text" placeholder="https://script.google.com/macros/s/.../exec" />

    <hr />
    <h3>📩 إعدادات التكت / الشكاوي</h3>

    <label>اختر كاتكوري التكت</label>
    <select id="ticketCategoryId">
      <option value="">-- بدون كاتكوري --</option>
    </select>

    <label>اختر رولات الإدارة اللي تشوف الشكوى وينعمل لها منشن</label>
    <div id="rolesContainer" class="roles-box">
      <span class="hint">سيتم تحميل الرولات تلقائياً بعد ربط الرابط...</span>
    </div>

    <label>رسالة التكت عند الفتح</label>
    <textarea id="ticketMessage"></textarea>
    <div class="hint">المتغيرات المتاحة: {user}</div>

    <hr />
    <h3>👋 رسالة الدخول (الترحيب)</h3>
    <div class="row">
      <input id="welcomeEnabled" type="checkbox" />
      <label for="welcomeEnabled" style="margin:0;">تفعيل رسالة الترحيب</label>
    </div>

    <label>اختر شات الترحيب</label>
    <select id="welcomeChannelId">
      <option value="">-- اختر شات --</option>
    </select>

    <label>رسالة الترحيب</label>
    <textarea id="welcomeMessage"></textarea>
    <div class="hint">المتغيرات المتاحة: {user} ، {server} ، {count}</div>

    <hr />
    <h3>🚪 رسالة المغادرة (التوديع)</h3>
    <div class="row">
      <input id="goodbyeEnabled" type="checkbox" />
      <label for="goodbyeEnabled" style="margin:0;">تفعيل رسالة التوديع</label>
    </div>

    <label>اختر شات التوديع</label>
    <select id="goodbyeChannelId">
      <option value="">-- اختر شات --</option>
    </select>

    <label>رسالة التوديع</label>
    <textarea id="goodbyeMessage"></textarea>
    <div class="hint">المتغيرات المتاحة: {tag} ، {count}</div>

    <button onclick="saveConfig()">💾 حفظ الإعدادات</button>
    <div id="status" class="msg"></div>
  </div>

  <script>
    const apiInput = document.getElementById('apiUrl');
    let selectedRoles = [];

    apiInput.value = localStorage.getItem('bot_api_url') || '';
    if (apiInput.value) loadAll();

    apiInput.addEventListener('change', () => {
      localStorage.setItem('bot_api_url', apiInput.value.trim());
      if (apiInput.value.trim()) loadAll();
    });

    function fillSelect(selectEl, items, defaultLabel, currentVal) {
      selectEl.innerHTML = `<option value="">${defaultLabel}</option>`;
      for (const item of items) {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = `# ${item.name}`;
        if (item.id === currentVal) opt.selected = true;
        selectEl.appendChild(opt);
      }
    }

    function renderRoles(roles, activeIds) {
      const container = document.getElementById('rolesContainer');
      if (!roles || roles.length === 0) {
        container.innerHTML = '<span class="hint">لا توجد رولات متاحة حالياً</span>';
        return;
      }
      container.innerHTML = '';
      for (const role of roles) {
        const div = document.createElement('label');
        div.className = 'role-item';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = role.id;
        cb.checked = activeIds.includes(role.id);
        cb.addEventListener('change', () => {
          if (cb.checked) {
            if (!selectedRoles.includes(role.id)) selectedRoles.push(role.id);
          } else {
            selectedRoles = selectedRoles.filter((id) => id !== role.id);
          }
        });
        const span = document.createElement('span');
        span.textContent = role.name;
        div.appendChild(cb);
        div.appendChild(span);
        container.appendChild(div);
      }
    }

    async function loadAll() {
      const url = apiInput.value.trim();
      if (!url) return;
      const status = document.getElementById('status');
      status.textContent = '⏳ جاري تحميل الإعدادات والشاتات...';
      try {
        const res = await fetch(url);
        const raw = await res.json();
        const cfg = raw.config || raw || {};
        const meta = raw.meta || {};

        selectedRoles = String(cfg.mentionRoleIds || '')
          .split(',')
          .map((s) => s.trim())
          .filter(Boolean);

        fillSelect(
          document.getElementById('ticketCategoryId'),
          meta.categories || [],
          '-- بدون كاتكوري --',
          cfg.ticketCategoryId || ''
        );
        fillSelect(
          document.getElementById('welcomeChannelId'),
          meta.channels || [],
          '-- اختر شات الترحيب --',
          cfg.welcomeChannelId || ''
        );
        fillSelect(
          document.getElementById('goodbyeChannelId'),
          meta.channels || [],
          '-- اختر شات التوديع --',
          cfg.goodbyeChannelId || ''
        );

        renderRoles(meta.roles || [], selectedRoles);

        document.getElementById('ticketMessage').value = cfg.ticketMessage || '';
        document.getElementById('welcomeEnabled').checked = Boolean(cfg.welcomeEnabled);
        document.getElementById('welcomeMessage').value = cfg.welcomeMessage || '';
        document.getElementById('goodbyeEnabled').checked = Boolean(cfg.goodbyeEnabled);
        document.getElementById('goodbyeMessage').value = cfg.goodbyeMessage || '';

        status.textContent = '✅ تم تحميل البيانات بنجاح';
      } catch (e) {
        status.textContent = '❌ تعذر جلب البيانات، تأكد من الرابط والنشر';
      }
    }

    async function saveConfig() {
      const url = apiInput.value.trim();
      const status = document.getElementById('status');
      if (!url) {
        status.textContent = '⚠️ أدخل رابط Google Apps Script أولاً';
        return;
      }
      localStorage.setItem('bot_api_url', url);

      const payload = {
        ticketCategoryId: document.getElementById('ticketCategoryId').value,
        mentionRoleIds: selectedRoles.join(','),
        ticketMessage: document.getElementById('ticketMessage').value.trim(),
        welcomeEnabled: document.getElementById('welcomeEnabled').checked,
        welcomeChannelId: document.getElementById('welcomeChannelId').value,
        welcomeMessage: document.getElementById('welcomeMessage').value.trim(),
        goodbyeEnabled: document.getElementById('goodbyeEnabled').checked,
        goodbyeChannelId: document.getElementById('goodbyeChannelId').value,
        goodbyeMessage: document.getElementById('goodbyeMessage').value.trim(),
      };

      status.textContent = '⏳ جاري الحفظ...';
      try {
        const res = await fetch(url, {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        status.textContent = data.ok ? '✅ تم حفظ الإعدادات بنجاح!' : '❌ فشل الحفظ';
      } catch (e) {
        status.textContent = '❌ خطأ أثناء الإرسال';
      }
    }
  </script>
</body>
</html>
