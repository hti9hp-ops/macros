<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم البوت</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .box { max-width: 740px; margin: auto; background: #1e293b; padding: 24px; border-radius: 14px; }
    h2, h3 { margin-top: 0; color: #818cf8; }
    label { display: block; margin: 12px 0 6px; font-weight: bold; }
    input, select, textarea {
      width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px;
      border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px;
    }
    textarea { min-height: 75px; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .row input[type="checkbox"] { width: auto; }
    .roles-box {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155;
    }
    .role-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .role-item input { width: auto; margin: 0; }
    button {
      margin-top: 18px; width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #6366f1; color: white; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .msg { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="box">
    <h2>⚙️ تحكم التكت والترحيب والتوديع</h2>

    <label>رابط Google Apps Script (Web App URL)</label>
    <input id="apiUrl" type="text" placeholder="https://script.google.com/macros/s/.../exec" />

    <hr style="border-color:#334155; margin:20px 0;">
    <h3>📩 إعدادات التكت / الشكاوي</h3>

    <label>اختر كاتكوري التكت</label>
    <select id="ticketCategoryId">
      <option value="">-- بدون كاتكوري --</option>
    </select>

    <label>اختر رولات الإدارة اللي تشوف الشكوى وينعمل لها منشن</label>
    <div id="rolesContainer" class="roles-box">
      <span class="hint">سيتم تحميل الرولات تلقائياً بعد ربط الرابط...</span>
    </div>

    <label>رسالة التكت عند الفتح</label>
    <textarea id="ticketMessage"></textarea>
    <div class="hint">المتغيرات المتاحة: {user}</div>

    <hr style="border-color:#334155; margin:20px 0;">
    <h3>👋 رسالة الدخول (الترحيب)</h3>

    <div class="row">
      <input id="welcomeEnabled" type="checkbox" />
      <label for="welcomeEnabled" style="margin:0;">تفعيل رسالة الترحيب</label>
    </div>

    <label>اختر شات الترحيب</label>
    <select id="welcomeChannelId">
      <option value="">-- اختر شات --</option>
    </select>

    <label>رسالة الترحيب</label>
    <textarea id="welcomeMessage"></textarea>
    <div class="hint">المتغيرات المتاحة: {user} ، {server} ، {count}</div>

    <hr style="border-color:#334155; margin:20px 0;">
    <h3>🚪 رسالة الخروج (التوديع)</h3>

    <div class="row">
      <input id="goodbyeEnabled" type="checkbox" />
      <label for="goodbyeEnabled" style="margin:0;">تفعيل رسالة التوديع</label>
    </div>

    <label>اختر شات التوديع</label>
    <select id="goodbyeChannelId">
      <option value="">-- اختر شات --</option>
    </select>

    <label>رسالة التوديع</label>
    <textarea id="goodbyeMessage"></textarea>
    <div class="hint">المتغيرات المتاحة: {user} ، {tag} ، {server} ، {count}</div>

    <button onclick="saveConfig()">💾 حفظ الإعدادات</button>
    <div id="statusMsg" class="msg"></div>
  </div>

  <script>
    const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbxJKcSFAoJNPY0SWMG-JFWQs5z4wYjJIBnxaCj8q6zpTkw-qgWJOce5oDVknvBntu2xNA/exec";
    const apiInput = document.getElementById("apiUrl");

    const savedUrl = localStorage.getItem("BOT_API_URL");
    if (savedUrl && savedUrl.includes("/exec")) {
      apiInput.value = savedUrl;
    } else {
      apiInput.value = DEFAULT_API_URL;
      localStorage.setItem("BOT_API_URL", DEFAULT_API_URL);
    }

    function setMsg(text, color = "#38bdf8") {
      const el = document.getElementById("statusMsg");
      el.style.color = color;
      el.textContent = text;
    }

    function populateSelect(selectEl, items, placeholder, selectedValue) {
      selectEl.innerHTML = "";
      const opt0 = document.createElement("option");
      opt0.value = "";
      opt0.textContent = placeholder;
      selectEl.appendChild(opt0);

      (items || []).forEach(item => {
        const opt = document.createElement("option");
        opt.value = item.id;
        opt.textContent = item.name;
        if (item.id === selectedValue) opt.selected = true;
        selectEl.appendChild(opt);
      });
    }

    function populateRoles(roles, selectedIds) {
      const container = document.getElementById("rolesContainer");
      container.innerHTML = "";
      const selectedSet = new Set(selectedIds || []);

      if (!roles || roles.length === 0) {
        container.innerHTML = '<span class="hint">لا توجد رولات متاحة حالياً</span>';
        return;
      }

      roles.forEach(role => {
        const wrapper = document.createElement("label");
        wrapper.className = "role-item";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = role.id;
        cb.checked = selectedSet.has(role.id);

        const span = document.createElement("span");
        span.textContent = role.name;

        wrapper.appendChild(cb);
        wrapper.appendChild(span);
        container.appendChild(wrapper);
      });
    }

    function getSelectedRoleIds() {
      return Array.from(document.querySelectorAll('#rolesContainer input[type="checkbox"]:checked'))
        .map(cb => cb.value);
    }

    async function loadConfig() {
      const url = apiInput.value.trim();
      if (!url) return;
      localStorage.setItem("BOT_API_URL", url);
      setMsg("⏳ جاري تحميل الإعدادات وقوائم السيرفر...");

      try {
        const res = await fetch(url);
        const data = await res.json();
        const cfg = data.config || data;
        const meta = data.meta || { categories: [], channels: [], roles: [] };

        populateSelect(
          document.getElementById("ticketCategoryId"),
          meta.categories,
          "-- بدون كاتكوري --",
          cfg.ticketCategoryId || ""
        );

        populateSelect(
          document.getElementById("welcomeChannelId"),
          meta.channels,
          "-- اختر شات --",
          cfg.welcomeChannelId || ""
        );

        populateSelect(
          document.getElementById("goodbyeChannelId"),
          meta.channels,
          "-- اختر شات --",
          cfg.goodbyeChannelId || ""
        );

        const roleIds = Array.isArray(cfg.mentionRoleIds)
          ? cfg.mentionRoleIds
          : String(cfg.mentionRoleIds || "")
              .split(",")
              .map(s => s.trim())
              .filter(Boolean);

        populateRoles(meta.roles, roleIds);

        document.getElementById("ticketMessage").value = cfg.ticketMessage || "";
        document.getElementById("welcomeEnabled").checked = Boolean(cfg.welcomeEnabled);
        document.getElementById("welcomeMessage").value = cfg.welcomeMessage || "";
        document.getElementById("goodbyeEnabled").checked = Boolean(cfg.goodbyeEnabled);
        document.getElementById("goodbyeMessage").value = cfg.goodbyeMessage || "";

        setMsg("✅ تم تحميل الإعدادات وقوائم السيرفر بنجاح", "#4ade80");
      } catch (err) {
        setMsg("❌ تعذر الجلب، تأكد من الرابط وصلاحيات النشر (Anyone)", "#f87171");
      }
    }

    async function saveConfig() {
      const url = apiInput.value.trim();
      if (!url) return setMsg("❌ حط رابط Web App أولاً", "#f87171");
      localStorage.setItem("BOT_API_URL", url);

      const payload = {
        ticketCategoryId: document.getElementById("ticketCategoryId").value,
        mentionRoleIds: getSelectedRoleIds(),
        ticketMessage: document.getElementById("ticketMessage").value,
        welcomeEnabled: document.getElementById("welcomeEnabled").checked,
        welcomeChannelId: document.getElementById("welcomeChannelId").value,
        welcomeMessage: document.getElementById("welcomeMessage").value,
        goodbyeEnabled: document.getElementById("goodbyeEnabled").checked,
        goodbyeChannelId: document.getElementById("goodbyeChannelId").value,
        goodbyeMessage: document.getElementById("goodbyeMessage").value
      };

      setMsg("⏳ جاري حفظ الإعدادات...");
      try {
        await fetch(url, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        setMsg("✅ تم إرسال وحفظ الإعدادات بنجاح", "#4ade80");
      } catch (err) {
        setMsg("❌ فشل الحفظ: " + err.message, "#f87171");
      }
    }

    apiInput.addEventListener("change", loadConfig);
    window.addEventListener("DOMContentLoaded", () => {
      if (apiInput.value.trim()) loadConfig();
    });
  </script>
</body>
</html>
