<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مايكرو فصيل شرطة mea me</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0b0b0b;
            color: #e0e0e0;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .header-banner-container {
            margin-bottom: 15px;
        }
        .header-banner {
            width: 100%;
            max-width: 280px;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transition: transform 0.3s ease;
        }
        .header-banner:hover {
            transform: scale(1.03);
        }
        h1 {
            color: #d4af37;
            font-size: 26px;
            margin-bottom: 2px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
        .rank-subtitle {
            color: #f1c40f;
            font-size: 15px;
            font-weight: bold;
            margin-top: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px rgba(241, 196, 15, 0.3);
        }
        p.subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-container {
            background: #141414;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #d4af37;
            display: inline-block;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }
        input[type="text"]#playerName {
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #1f1f1f;
            color: #fff;
            width: 280px;
            text-align: center;
            outline: none;
        }
        input[type="text"]#playerName:focus {
            border-color: #d4af37;
        }
        h2.category-title {
            color: #d4af37;
            font-size: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-top: 35px;
            text-align: right;
            margin-right: 5%;
            margin-left: 5%;
        }
        .macro-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .macro-box {
            width: 65%;
            max-width: 550px;
            background: #161616;
            color: #00ffcc;
            padding: 10px;
            font-family: monospace;
            border-radius: 5px;
            border: 1px solid #333;
            text-align: right;
            direction: ltr;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .macro-row input.macro-box {
            direction: rtl;
        }
        .macro-box.copied-flash {
            border-color: #d4af37 !important;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.7);
        }
        button.copy-btn {
            padding: 10px 18px;
            font-size: 14px;
            background: #d4af37;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        button.copy-btn:hover {
            background: #b2912a;
        }
        .footer-founder {
            margin-top: 50px;
            padding: 20px;
            color: #f1c40f;
            font-size: 16px;
            font-weight: bold;
            border-top: 1px solid #222;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.2);
        }
        #toast {
            visibility: hidden;
            min-width: 220px;
            background-color: #141414;
            color: #d4af37;
            text-align: center;
            border-radius: 8px;
            padding: 12px 20px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 15px;
            font-weight: bold;
            border: 1px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body>

    <!-- صورة الفصيل والقائد في أعلى الموقع -->
    <div class="header-banner-container">
        <img src="C44FC656-9F85-4E2A-8F24-A3DD222CA508.png" alt="Ehab Engineer - One State" class="header-banner">

    <h1>مايكروز فصيل شرطة MESA ME</h1>
    <div class="rank-subtitle">قائد الشرطة اللواء الفيدرالي Ehab Engineer</div>

    <div class="input-container">
        <label for="playerName" style="display: block; margin-bottom: 8px; color: #d4af37; font-weight: bold;">اكتب اسمك داخل اللعبة (الضابط):</label>
        <input type="text" id="playerName" placeholder="اكتب اسمك هنا..." oninput="updateMacros()">
    </div>

    <!-- التحذيرات -->
    <h2 class="category-title">التحذيرات الأمنية</h2>
    <div class="macro-row"><input type="text" id="w1" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('w1')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="w2" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('w2')">نسخ</button></div>

    <div class="macro-row"><input type="text" id="w5" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('w5')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="w6" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('w6')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="w7" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('w7')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="w8" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('w8')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="w9" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('w9')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="w10" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('w10')">نسخ</button></div>

    <!-- المخالفات الجنائية -->
    <h2 class="category-title">المخالفات الجنائية</h2>
    <div class="macro-row"><input type="text" id="c1" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('c1')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="c2" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('c2')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="c3" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('c3')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="c4" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('c4')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="c5" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('c5')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="c6" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('c6')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="c7" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('c7')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="c8" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('c8')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="c9" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('c9')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="c10" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('c10')">نسخ</button></div>

    <!-- المخالفات المدنية -->
    <h2 class="category-title">المخالفات المدنية</h2>
    <div class="macro-row"><input type="text" id="v1" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('v1')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="v2" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('v2')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="v3" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('v3')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="v4" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('v4')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="v5" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('v5')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="v6" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('v6')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="v7" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('v7')">نسخ</button></div>

    <!-- المخالفات الإدارية -->
    <h2 class="category-title">المخالفات الإدارية</h2>
    <div class="macro-row"><input type="text" id="a1" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('a1')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="a2" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('a2')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="a3" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('a3')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="a4" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('a4')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="a5" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('a5')">نسخ</button></div>
    <div class="macro-row"><input type="text" id="a6" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('a6')">نسخ</button></div>

    <!-- التذييل -->
    <div class="footer-founder">
        مؤسس المشروع The Warden
    </div>

    <!-- عنصر التنبيه العصري -->
    <div id="toast">تم نسخ الماكرو بنجاح!</div>

    <script>
        function updateMacros() {
            let name = document.getElementById("playerName").value || "[اسمك غير محدد]";

            // التحذيرات
            document.getElementById("w1").value = `/do التحذير الأول : شرطة المدينة هنا!توقف” فورآ مكانك ولا تقم بأي حركة!!”`;
            document.getElementById("w2").value = `/do !!! التحذير الأخير: ارمِ سلاحك أرضاً فوراً! وارفع يديك عند رأسك!`;
            document.getElementById("w3").value = `/do !!! تنبيه أمني: أنت داخل منطقة محظورة! اخرج فوراً وإلا سيتم استخدام الصاعق الكهربائي أو القوة المميتة ضدك!`;
            document.getElementById("w4").value = `/do تحذير: هذه المنطقة تحت السيطرة الأمنية الكاملة وهي غير آمنة للمدنيين. الابتعاد فوراً ضروري لتجنب الاعتقال والعقوبة!`;
            document.getElementById("w5").value = `/do تحذير: يُمنع التواجد أو التجمهر داخل حرم المستشفى لأكثر من دقيقة لضمان سير العمل الطبي. المغادرة فوراً إجبارية لتجنب العقوبة القانونية!`;
            document.getElementById("w6").value = `/do مرحباً سيدي/سيدتي، معكم الضابط (${name}). يرجى إبراز الهوية الشخصية أو جواز السفر للتدقيق الأمني، تعاونك يسرّع الإجراءات`;
            document.getElementById("w7").value = `/do تم التدقيق، أوراقك سليمة. شكراً لتعاونك مع رجال الأمن وتقديرك لعملنا. رافقتك السلامة، يومك سعيد!`;
            document.getElementById("w8").value = `/do سيدي/سيدتي، أنا الضابط (${name})، أنت قيد الاعتقال الآن لارتكابك مخالفة قانونية. لديك الحق في التزام الصمت، ولديكم الحق في توكيل محامٍ. أي شيء تقوله قد يُستخدم ضدك في المحكمة`;
            document.getElementById("w9").value = `/do سيدي،أنا الضابط (${name})، ”يتم إيقافك الآن لوجود انتهاكات قانونية في وثائقك الرسمية، سيتم تحويلك للجهات المختصة ولك الحق في محامٍ وجلسة استماع عادلة”`;
            document.getElementById("w10").value = `/do سيدي، أنا الضابط (${name})، أنت مطلوب للعدالة بموجب مذكرة توقيف رسمية صادرة بحقك. سيتم اقتيادك للمركز الآن، ولك كافة الحقوق القانونية لطلب محامٍ والدفاع عن نفسك`;

            // المخالفات الجنائية
            document.getElementById("c1").value = `/me 1.1 الاستيلاء على مؤسسات الدولة [+20 دقيقة]`;
            document.getElementById("c2").value = `/me 1.2 الاستيلاء على السلطة بالقوة؛  [+20 دقيقة]`;
            document.getElementById("c3").value = `/me 1.3 أخذ الرهائن أو الاختطاف [+20 دقيقة]`;
            document.getElementById("c4").value = `/me 1.4 الاصطدام المميت بالمشاة [+20 دقيقة]`;
            document.getElementById("c5").value = `/me 1.5 محاولة السرقة [+20 دقيقة]`;
            document.getElementById("c6").value = `/me 1.6 سرقة ضابط شرطة [+20 دقيقة]`;
            document.getElementById("c7").value = `/me 1.7 الدخول غير المنسق إلى الأراضي المحمية بالقانون [+20 دقيقة]`;
            document.getElementById("c8").value = `/me 1.8 الاصطدام بالمشاة [+20 دقيقة]`;
            document.getElementById("c9").value = `/me 1.9إشهار سلاح في مكان عام[+20 دقيقة]`;
            document.getElementById("c10").value = `/me 1.10 رشوة ضابط شرطة [+20 دقيقة]`;

            // المخالفات المدنية
            document.getElementById("v1").value = `/me 2.1 إتلاف ممتلكات الدولة [+10 دقائق]`;
            document.getElementById("v2").value = `/me 2.2 الإضرار أو التلف بالممتلكات الخاصة  [+10 دقائق]`;
            document.getElementById("v3").value = `/me 2.3 مكالمات كاذبة للشرطة و/أو خدمات الطوارئ [+10 دقائق]`;
            document.getElementById("v4").value = `/me 2.4 الفجور (تشغيل الموسيقى بعد أن يُطلب منك إيقاف تشغيلها/البصق في وجه شخص ما، إلخ) [+10 دقائق]`;
            document.getElementById("v5").value = `/me 2.5 التهديد بالقتل [+10 دقائق]`;
            document.getElementById("v6").value = `/me 2.6 إهانة موظف حكومي [+10 دقائق]`;
            document.getElementById("v7").value = `/me 2.7 الابتزاز [+10 دقائق]`;

            // المخالفات الإدارية
            document.getElementById("a1").value = `/me 3.1 مقاومة الاعتقال [+5 دقائق]`;
            document.getElementById("a2").value = `/me 3.2 عصيان ضابط الشرطة [+5 دقائق]`;
            document.getElementById("a3").value = `/me 3.3 المساعدة في مقاومة الاعتقال [+5 دقائق]`;
            document.getElementById("a4").value = `/me 3.4 انتهاك قواعد المرور: القيادة في المسار المعاكس، الاصطدام بالأعمدة، تجاوز الإشارات الحمراء [+5 دقائق]`;
            document.getElementById("a5").value = `/me 3.5 الاعتداء على مدني (ضرب) [+5 دقائق]`;
            document.getElementById("a6").value = `/me 3.6 رفض تقديم المستندات المطلوبة: بطاقة الهوية، ومستندات السيارة، ورخص الأسلحة[+5 دقائق]`;
        }

        updateMacros();

        function sendToDiscord(officerName, macroText) {
            const webhookUrl = "https://discord.com/api/webhooks/1552225530106093671/9oZzEuAGZj2QadNpul7N0EkzmgqqrDsb3fDMx2IDTPLVyQc8L25nUNMMvnb25E2PHw3K";
            
            const payload = {
                embeds: [{
                    title: "🚨 استخدام ماكرو أمني جديد",
                    color: 13882327, // لون ذهبي
                    fields: [
                        { name: "👤 اسم الضابط:", value: officerName, inline: true },
                        { name: "📋 النص المنسوخ:", value: "```" + macroText + "```", inline: false }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            // استخدام خدمة وسيطة مجانية وموثوقة لتجاوز حظر CORS للمتصفحات
            fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(webhookUrl), {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            }).catch(error => {
                console.error("Error sending to Discord:", error);
            });
        }

        function copyLine(id) {
            let copyText = document.getElementById(id);
            let officerName = document.getElementById("playerName").value || "ضابط مجهول";
            
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);

            // إرسال إشعار للديسكورد تلقائياً عبر الوسيط
            sendToDiscord(officerName, copyText.value);

            // تفعيل الومضة الذهبية على الحقل المنسوخ
            copyText.classList.add("copied-flash");
            setTimeout(() => {
                copyText.classList.remove("copied-flash");
            }, 800);

            // إظهار التنبيه العصري المتحرك في الأسفل
            let toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => {
                toast.className = toast.className.replace("show", "");
            }, 2000);
        }
    </script>
