<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
body {
font-family: Tahoma, sans-serif;
background-color: #0b0b0b;
color: #e0e0e0;
text-align: center;
padding: 20px;
margin: 0;
}
h1 {
color: #d4af37;
font-size: 26px;
margin-bottom: 5px;
text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
}
p.subtitle {
color: #888;
font-size: 14px;
margin-bottom: 25px;
}
.input-container {
background: #141414;
padding: 15px;
border-radius: 10px;
border: 1px solid #d4af37;
display: inline-block;
margin-bottom: 25px;
box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
}
input[type="text"]#playerName {
padding: 12px;
font-size: 16px;
border-radius: 5px;
border: 1px solid #444;
background: #1f1f1f;
color: #fff;
width: 280px;
text-align: center;
outline: none;
}
input[type="text"]#playerName:focus {
border-color: #d4af37;
}
h2.category-title {
color: #d4af37;
font-size: 20px;
border-bottom: 2px solid #333;
padding-bottom: 8px;
margin-top: 35px;
text-align: right;
margin-right: 5%;
margin-left: 5%;
}
.macro-row {
display: flex;
justify-content: center;
align-items: center;
gap: 10px;
margin-bottom: 12px;
}
.macro-box {
width: 65%;
max-width: 550px;
background: #161616;
color: #00ffcc;
padding: 10px;
font-family: monospace;
border-radius: 5px;
border: 1px solid #333;

}
.macro-row input.macro-box {
direction: rtl; /* لجعل النص العربي يظهر بشكل صحيح */
}
button.copy-btn {
padding: 10px 18px;
font-size: 14px;
background: #d4af37;
color: #000;
font-weight: bold;
border: none;
border-radius: 5px;
cursor: pointer;
transition: 0.2s;
}
button.copy-btn:hover {

}
</style>

<div class="macro-row"><input type="text" id="a6" class="macro-box" readonly><button class="copy-btn" onclick="copyLine('a6')">نسخ</button></div>

<script>
function updateMacros() {
let name = document.getElementById("playerName").value || "[اسمك]";

// التحذيرات
document.getElementById("w1").value = `/do التحذير الأول : شرطة المدينة هنا!توقف” فورآ مكانك ولا تقم بأي حركة!!”`;
document.getElementById("w2").value = `/do !!! التحذير الأخير: ارمِ سلاحك أرضاً فوراً! وارفع يديك عند رأسك!`;
document.getElementById("w3").value = `/do !!! تنبيه أمني: أنت داخل منطقة محظورة! اخرج فوراً وإلا سيتم استخدام الصاعق الكهربائي أو القوة المميتة ضدك!`;
document.getElementById("w4").value = `/do تحذير: هذه المنطقة تحت السيطرة الأمنية الكاملة وهي غير آمنة للمدنيين. الابتعاد فوراً ضروري لتجنب الاعتقال والعقوبة!`;
document.getElementById("w5").value = `/do تحذير: يُمنع التواجد أو التجمهر داخل حرم المستشفى لأكثر من دقيقة لضمان سير العمل الطبي. المغادرة فوراً إجبارية لتجنب العقوبة القانونية!`;
document.getElementById("w6").value = `/do مرحباً سيدي/سيدتي، معكم الضابط (${name}). يرجى إبراز الهوية الشخصية أو جواز السفر للتدقيق الأمني، تعاونك يسرّع الإجراءات`;
document.getElementById("w7").value = `/do تم التدقيق، أوراقك سليمة. شكراً لتعاونك مع رجال الأمن وتقديرك لعملنا. رافقتك السلامة، يومك سعيد!`;
document.getElementById("w8").value = `/do سيدي/سيدتي، أنا الضابط (${name})، أنت قيد الاعتقال الآن لارتكابك مخالفة قانونية. لديك الحق في التزام الصمت، ولديكم الحق في توكيل محامٍ. أي شيء تقوله قد يُستخدم ضدك في المحكمة`;
document.getElementById("w9").value = `/do سيدي،أنا الضابط (${name})، ”يتم إيقافك الآن لوجود انتهاكات قانونية في وثائقك الرسمية، سيتم تحويلك للجهات المختصة ولك الحق في محامٍ وجلسة استماع عادلة”`;
document.getElementById("w10").value = `/do سيدي، أنا الضابط (${name})، أنت مطلوب للعدالة بموجب مذكرة توقيف رسمية صادرة بحقك. سيتم اقتيادك للمركز الآن، ولك كافة الحقوق القانونية لطلب محامٍ والدفاع عن نفسك`;

// المخالفات الجنائية
document.getElementById("c1").value = `/me 1.1 الاستيلاء على مؤسسات الدولة [+20 دقيقة]`;
document.getElementById("c2").value = `/me 1.2 الاستيلاء على السلطة بالقوة؛ [+20 دقيقة]`;
document.getElementById("c3").value = `/me 1.3 أخذ الرهائن أو الاختطاف [+20 دقيقة]`;
document.getElementById("c4").value = `/me 1.4 الاصطدام المميت بالمشاة [+20 دقيقة]`;
document.getElementById("c5").value = `/me 1.5 محاولة السرقة [+20 دقيقة]`;
document.getElementById("c6").value = `/me 1.6 سرقة ضابط شرطة [+20 دقيقة]`;
document.getElementById("c7").value = `/me 1.7 الدخول غير المنسق إلى الأراضي المحمية بالقانون [+20 دقيقة]`;
document.getElementById("c8").value = `/me 1.8 الاصطدام بالمشاة [+20 دقيقة]`;
document.getElementById("c9").value = `/me 1.9إشهار سلاح في مكان عام[+20 دقيقة]`;
document.getElementById("c10").value = `/me 1.10 رشوة ضابط شرطة [+20 دقيقة]`;

// المخالفات المدنية
document.getElementById("v1").value = `/me 2.1 إتلاف ممتلكات الدولة [+10 دقائق]`;
document.getElementById("v2").value = `/me 2.2 الإضرار أو التلف بالممتلكات الخاصة [+10 دقائق]`;
document.getElementById("v3").value = `/me 2.3 مكالمات كاذبة للشرطة و/أو خدمات الطوارئ [+10 دقائق]`;
document.getElementById("v4").value = `/me 2.4 الفجور (تشغيل الموسيقى بعد أن يُطلب منك إيقاف تشغيلها/البصق في وجه شخص ما، إلخ) [+10 دقائق]`;
document.getElementById("v5").value = `/me 2.5 التهديد بالقتل [+10 دقائق]`;
document.getElementById("v6").value = `/me 2.6 إهانة موظف حكومي [+10 دقائق]`;
document.getElementById("v7").value = `/me 2.7 الابتزاز [+10 دقائق]`;

// المخالفات الإدارية
document.getElementById("a1").value = `/me 3.1 مقاومة الاعتقال [+5 دقائق]`;
document.getElementById("a2").value = `/me 3.2 عصيان ضابط الشرطة [+5 دقائق]`;
document.getElementById("a3").value = `/me 3.3 المساعدة في مقاومة الاعتقال [+5 دقائق]`;
document.getElementById("a4").value = `/me 3.4 انتهاك قواعد المرور: القيادة في المسار المعاكس، الاصطدام بالأعمدة، تجاوز الإشارات الحمراء [+5 دقائق]`;
document.getElementById("a5").value = `/me 3.5 الاعتداء على مدني (ضرب) [+5 دقائق]`;
document.getElementById("a6").value = `/me 3.6 رفض تقديم المستندات المطلوبة: بطاقة الهوية، ومستندات السيارة، ورخص الأسلحة[+5 دقائق]`;
}

// تشغيل الدالة أول ما يفتح الموقع
updateMacros();

function copyLine(id) {
let copyText = document.getElementById(id);
copyText.select();
copyText.setSelectionRange(0, 99999);
navigator.clipboard.writeText(copyText.value);
alert("تم نسخ الماكرو بنجاح!");
}
</script>
