<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Warning</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding-top: 20vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 3rem;
            color: #ff0000;
            text-shadow: 0px 0px 10px #ff0000;
            animation: blink 0.5s infinite;
        }
        p {
            font-size: 1.5rem;
        }
        .code-box {
            background: #111;
            border: 1px solid #00ff00;
            width: 80%;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            text-align: left;
            direction: ltr;
            height: 150px;
            overflow: hidden;
            font-size: 0.9rem;
            color: #00ff00;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>⚠️ تحذير: تم اختراق الجهاز! ⚠️</h1>
    <p>جاري سحب الصور والملفات الشخصية...</p>
    
    <div class="code-box" id="terminal">
        > Initializing exploit...<br>
    </div>

    <script>
        const logs = [
            "> Connecting to remote server...",
            "> IP Address detected: 192.168.1.105",
            "> Accessing DCIM / Gallery folder...",
            "> Downloading 1,420 photos...",
            "> Extracting WhatsApp chats and contacts...",
            "> Accessing front camera stream...",
            "> Uploading files to secure server [██████████] 100%",
            "> System compromised successfully. Have a nice day! :D"
        ];

        let index = 0;
        const terminal = document.getElementById("terminal");

        function showLogs() {
            if (index < logs.length) {
                terminal.innerHTML += logs[index] + "<br>";
                index++;
                setTimeout(showLogs, 800);
            } else {
                setTimeout(() => {
                    alert("تم اكمال سحب المعلومات بنجاح يمكنك الخروج وتواصل مع Hasan. يولد ترا موحا الكواد سوا السكربت ");
                }, 1000);
            }
        }

        setTimeout(showLogs, 1000);
    </script>

</body>
</html>
