<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير دورية المستشفى</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #1a1a1a; color: #fff; padding: 20px; direction: rtl; }
        .container { max-width: 500px; margin: 0 auto; background: #2c2c2c; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ff4757; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: none; border-radius: 5px; background: #3c3c3c; color: #fff; box-sizing: border-box; }
        input[type="file"] { background: #444; cursor: pointer; padding: 8px; }
        button { width: 100%; background: #ff4757; color: white; padding: 12px; border: none; border-radius: 5px; margin-top: 20px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff6b81; }
        #loading { display: none; text-align: center; margin-top: 10px; color: #ff6b81; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚨 تقرير دورية المستشفى</h2>
    <form id="reportForm">
        <label>اسم قائد الدورية:</label>
        <input type="text" id="leaderName" required>

        <label>تاريخ الدورية:</label>
        <input type="text" id="reportDate" required>

        <label>وقت دخول المستشفى:</label>
        <input type="text" id="timeIn" required>

        <label>وقت الخروج من المستشفى:</label>
        <input type="text" id="timeOut" required>

        <label>إرفاق الصورة الأولى (دخول):</label>
        <input type="file" id="imageFile1" accept="image/*" required>

        <label>إرفاق الصورة الثانية (خروج):</label>
        <input type="file" id="imageFile2" accept="image/*" required>

        <div id="loading">جاري إرسال التقرير والصور... ⏳</div>
        <button type="submit" id="submitBtn">إرسال التقرير إلى ديسكورد</button>
    </form>
</div>

<script>
    document.getElementById('reportForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const webhookUrl = "https://discord.com/api/webhooks/1552613985453477908/UtWZAf3yiGmMcLVBER8s8cj4AigbiB29yKGcbVtrMWMyYUXOTELGTHzo5II2SyOfEBxO";
        
        const leaderName = document.getElementById('leaderName').value;
        const reportDate = document.getElementById('reportDate').value;
        const timeIn = document.getElementById('timeIn').value;
        const timeOut = document.getElementById('timeOut').value;
        const imageFile1 = document.getElementById('imageFile1').files[0];
        const imageFile2 = document.getElementById('imageFile2').files[0];

        if (!imageFile1 || !imageFile2) {
            alert('الرجاء اختيار الصورتين معاً!');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('submitBtn').disabled = true;

        try {
            const formData = new FormData();
            
            const content = `🚨 **تقرير دورية جديد تم استلامه!**\n\n` +
                            `**اسم قائد الدورية:** ${leaderName}\n` +
                            `**تاريخ الدورية:** ${reportDate}\n` +
                            `**وقت دخول المستشفى:** ${timeIn}\n` +
                            `**وقت الخروج من المستشفى:** ${timeOut}`;

            formData.append('content', content);
            // إضافة الصورتين بإسمين مختلفين ليقبلها ديسكورد
            formData.append('file1', imageFile1);
            formData.append('file2', imageFile2);

            const response = await fetch(webhookUrl, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                alert('تم إرسال التقرير والصورتين بنجاح إلى ديسكورد!');
                document.getElementById('reportForm').reset();
            } else {
                alert('حدث خطأ أثناء الإرسال.');
            }

        } catch (error) {
            console.error('Error:', error);
            alert('حدث خطأ في الاتصال.');
        } finally {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('submitBtn').disabled = false;
        }
    });
</script>

</body>
</html>
