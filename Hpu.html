<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير دورية المستشفى - Ehab Engineer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: Tahoma, sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .modern-card {
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .main-title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 4px;
        }
        .main-sub {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .form-header {
            text-align: center;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .field-group {
            margin-bottom: 14px;
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: 600; 
            color: #cbd5e1;
            font-size: 12px;
        }
        input { 
            width: 100%; 
            padding: 11px 12px; 
            border: 1px solid #475569; 
            border-radius: 8px; 
            background: #0f172a; 
            color: #fff; 
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        input::placeholder {
            color: #64748b;
        }
        input[type="file"] { 
            cursor: pointer; 
            padding: 8px; 
            color: #38bdf8;
            font-size: 12px;
        }
        .submit-btn { 
            width: 100%; 
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
            color: white; 
            padding: 13px; 
            border: none; 
            border-radius: 8px; 
            margin-top: 15px; 
            font-size: 15px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
            transition: 0.2s;
        }
        .submit-btn:hover { 
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%); 
        }
        #loading { 
            display: none; 
            text-align: center; 
            margin-top: 12px; 
            color: #38bdf8; 
            font-weight: bold; 
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="modern-card">
    <div class="main-title">Ehab Engineer</div>
    <div class="main-sub">نظام الماكرو الموحد للعمليات الأمنية</div>

    <div class="form-header">🚨 تقرير دورية المستشفى</div>

    <form id="reportForm">
        <div class="field-group">
            <label>أسم قائد الدورية:</label>
            <input type="text" id="leaderName" placeholder="أدخل اسم قائد الدورية هنا..." required>
        </div>

        <div class="field-group">
            <label>تاريخ الدورية:</label>
            <input type="text" id="reportDate" placeholder="اختر تاريخ الدورية..." required>
        </div>

        <div class="field-group">
            <label>وقت دخول المستشفى:</label>
            <input type="text" id="timeIn" placeholder="اختر وقت الدخول..." required>
        </div>

        <div class="field-group">
            <label>وقت الخروج من المستشفى:</label>
            <input type="text" id="timeOut" placeholder="اختر وقت الخروج..." required>
        </div>

        <div class="field-group">
            <label>إرفاق الصورة الأولى (دخول):</label>
            <input type="file" id="imageFile1" accept="image/*" required>
        </div>

        <div class="field-group">
            <label>إرفاق الصورة الثانية (خروج):</label>
            <input type="file" id="imageFile2" accept="image/*" required>
        </div>

        <div id="loading">جاري إرسال التقرير والصور... ⏳</div>
        <button type="submit" id="submitBtn" class="submit-btn">إرسال التقرير إلى ديسكورد ✈️</button>
    </form>
</div>

<script>
    document.getElementById('reportForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const webhookUrl = "https://discord.com/api/webhooks/1552613985453477908/UtWZAf3yiGmMcLVBER8s8cj4AigbiB29yKGcbVtrMWMyYUXOTELGTHzo5II2SyOfEBxO";
        
        const leaderName = document.getElementById('leaderName').value;
        const reportDate = document.getElementById('reportDate').value;
        const timeIn = document.getElementById('timeIn').value;
        const timeOut = document.getElementById('timeOut').value;
        const imageFile1 = document.getElementById('imageFile1').files[0];
        const imageFile2 = document.getElementById('imageFile2').files[0];

        if (!imageFile1 || !imageFile2) {
            alert('الرجاء اختيار الصورتين معاً!');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('submitBtn').disabled = true;

        try {
            const formData = new FormData();
            
            const content = `🛡️ **تقرير دورية جديد - Ehab Engineer**\n\n` +
                            `**اسم قائد الدورية:** ${leaderName}\n` +
                            `**تاريخ الدورية:** ${reportDate}\n` +
                            `**وقت دخول المستشفى:** ${timeIn}\n` +
                            `**وقت الخروج من المستشفى:** ${timeOut}`;

            formData.append('content', content);
            formData.append('file1', imageFile1);
            formData.append('file2', imageFile2);

            const response = await fetch(webhookUrl, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                alert('تم إرسال التقرير والصورتين بنجاح إلى ديسكورد!');
                document.getElementById('reportForm').reset();
            } else {
                alert('حدث خطأ أثناء الإرسال.');
            }

        } catch (error) {
            console.error('Error:', error);
            alert('حدث خطأ في الاتصال.');
        } finally {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('submitBtn').disabled = false;
        }
    });
</script>

</body>
</html>
