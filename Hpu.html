<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير دورية المستشفى - Ehab Engineer</title>
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            background-color: #0b0b0b; 
            color: #ffd700; 
            padding: 15px; 
            direction: rtl; 
            margin: 0;
        }
        .container { 
            max-width: 480px; 
            margin: 0 auto; 
            background: linear-gradient(135deg, #1a150c 0%, #0d0a05 100%); 
            padding: 25px; 
            border-radius: 15px; 
            border: 2px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3); 
        }
        .header-title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .sub-title {
            text-align: center;
            font-size: 14px;
            color: #c5a059;
            margin-bottom: 25px;
        }
        h2 { 
            text-align: center; 
            color: #ffd700; 
            background: rgba(212, 175, 55, 0.1);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d4af37;
            font-size: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: bold; 
            color: #e6c687;
            font-size: 14px;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            border: 1px solid #d4af37; 
            border-radius: 8px; 
            background: #15120a; 
            color: #fff; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        input::placeholder {
            color: #665533;
        }
        input[type="file"] { 
            background: #15120a; 
            cursor: pointer; 
            padding: 10px; 
            color: #ffd700;
        }
        button { 
            width: 100%; 
            background: linear-gradient(to bottom, #b30000 0%, #660000 100%); 
            color: white; 
            padding: 14px; 
            border: 1px solid #ff4d4d; 
            border-radius: 8px; 
            margin-top: 25px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 4px 10px rgba(179, 0, 0, 0.4);
            transition: 0.3s;
        }
        button:hover { 
            background: linear-gradient(to bottom, #cc0000 100%, #800000 100%); 
        }
        #loading { 
            display: none; 
            text-align: center; 
            margin-top: 15px; 
            color: #ffd700; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">Ehab Engineer</div>
    <div class="sub-title">نظام الماكرو الموحد للعمليات الأمنية</div>

    <h2>🚨 تقرير دورية المستشفى</h2>
    
    <form id="reportForm">
        <label>أسم قائد الدورية:</label>
        <input type="text" id="leaderName" placeholder="أدخل اسم قائد الدورية هنا..." required>

        <label>تاريخ الدورية:</label>
        <input type="text" id="reportDate" placeholder="اختر تاريخ الدورية..." required>

        <label>وقت دخول المستشفى:</label>
        <input type="text" id="timeIn" placeholder="اختر وقت الدخول..." required>

        <label>وقت الخروج من المستشفى:</label>
        <input type="text" id="timeOut" placeholder="اختر وقت الخروج..." required>

        <label>إرفاق الصورة الأولى (دخول):</label>
        <input type="file" id="imageFile1" accept="image/*" required>

        <label>إرفاق الصورة الثانية (خروج):</label>
        <input type="file" id="imageFile2" accept="image/*" required>

        <div id="loading">جاري إرسال التقرير والصور... ⏳</div>
        <button type="submit" id="submitBtn">إرسال التقرير إلى ديسكورد ✈️</button>
    </form>
</div>

<script>
    document.getElementById('reportForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const webhookUrl = "https://discord.com/api/webhooks/1552613985453477908/UtWZAf3yiGmMcLVBER8s8cj4AigbiB29yKGcbVtrMWMyYUXOTELGTHzo5II2SyOfEBxO";
        
        const leaderName = document.getElementById('leaderName').value;
        const reportDate = document.getElementById('reportDate').value;
        const timeIn = document.getElementById('timeIn').value;
        const timeOut = document.getElementById('timeOut').value;
        const imageFile1 = document.getElementById('imageFile1').files[0];
        const imageFile2 = document.getElementById('imageFile2').files[0];

        if (!imageFile1 || !imageFile2) {
            alert('الرجاء اختيار الصورتين معاً!');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('submitBtn').disabled = true;

        try {
            const formData = new FormData();
            
            const content = `👑 **تقرير دورية جديد - Ehab Engineer**\n\n` +
                            `**اسم قائد الدورية:** ${leaderName}\n` +
                            `**تاريخ الدورية:** ${reportDate}\n` +
                            `**وقت دخول المستشفى:** ${timeIn}\n` +
                            `**وقت الخروج من المستشفى:** ${timeOut}`;

            formData.append('content', content);
            formData.append('file1', imageFile1);
            formData.append('file2', imageFile2);

            const response = await fetch(webhookUrl, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                alert('تم إرسال التقرير والصورتين بنجاح إلى ديسكورد!');
                document.getElementById('reportForm').reset();
            } else {
                alert('حدث خطأ أثناء الإرسال.');
            }

        } catch (error) {
            console.error('Error:', error);
            alert('حدث خطأ في الاتصال.');
        } finally {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('submitBtn').disabled = false;
        }
    });
</script>

</body>
</html>
